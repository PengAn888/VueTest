<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
		<title>vue1</title>
	</head>
	<body>
		<div id="app">
			{{message}}
			<div>
				<todo>
					<todo-title slot="todo-title"></todo-title>
					<todo-item v-for="item in items" slot="todo-itmes" v-bind:item="item"></todo-item>
				</todo>
			</div>
		</div>
		
		
		
		<script>
			Vue.component("todo",{
				template:"<div><slot name='todo-title'/></slot><ul><slot name='todo-itmes'/></ul></div>"
			})
			Vue.component("todo-title",{
				template:"<div>标题</div>"
			})
			Vue.component("todo-item",{
				props:['item'],
				template:"<li>{{item}}</li>"
			})
			var app = new Vue({
				el:'#app',
				data:{
					message: 'Hello Vue!',
					items:["1","2","3"]
				}
			})
		</script>
	</body>
</html>
