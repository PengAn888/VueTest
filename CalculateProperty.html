<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
		<title>CalculateProperty</title>
	</head>
	<body>
		<div id="app">
			<p>当前时间:{{getCurrnetTime()}}</p>
			<p>当前时间:{{getCurrnetTime1}}</p>
		</div>
		<script>
			var app = new Vue({
				el:'#app',
				data:{
					message: 'Hello Vue!'
				},
				methods : {
					getCurrnetTime : function(){
						return Date.now()
					}
				},
				computed : {
					getCurrnetTime1: function() {
						return Date.now()
					}
				}
			})
		</script>
	</body>
</html>
